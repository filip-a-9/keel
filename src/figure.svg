<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" role="img" aria-labelledby="fig-t fig-d" class="fig">
<title id="fig-t">Resource planning: mention rate by brand, with 95% intervals</title>
<desc id="fig-d">ChatGPT answers to resource-planning questions, 80 per brand. Asana 85%, interval 76% to 91%; monday.com 68%, interval 57% to 77%; Teamwork.com 25%, interval 17% to 35%; ClickUp 20%, interval 13% to 30%; Trello 3.8%, interval 1.3% to 10%; Notion 0%, interval 0% to 4.6%.</desc>
